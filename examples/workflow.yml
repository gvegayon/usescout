# Save as .github/workflows/usescout.yml in the repo of the package you want to track.
name: usescout
on:
  schedule: [{ cron: "0 6 * * 1" }]   # every Monday
  workflow_dispatch: {}
  pull_request:
    types: [closed]
permissions: { contents: write, pull-requests: write }
concurrency: usescout                   # never run two at once (the review branch is shared)
jobs:
  usescout:
    # A merged review PR is reconciled immediately, rather than waiting for the
    # next weekly run.  Keep this branch name in sync with review_branch when
    # customizing .usescout.yml.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'usescout-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gvegayon/usescout@v0
        with:
          search-token: ${{ secrets.USESCOUT_SEARCH_PAT }}   # optional; used only for code search, PRs stay bot-authored
          llm-provider: anthropic                                    # none | anthropic | openai | gemini | ollama
          llm-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
